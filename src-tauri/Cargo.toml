[package]
name = "emperor-mod-manager"
version = "0.4.0"
description = "Mod manager for Linux and Windows"
authors = ["emperor-mod-manager contributors"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "emperor_mod_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "custom-protocol", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
directories = "5"
toml = "0.8"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
flate2 = "1"
serde_yaml = "0.9"
zip = "2"
unrar-ng = "0.7"
sevenz-rust = "0.6"
sanitize-filename = "0.6"
walkdir = "2"
futures-util = "0.3"
url = "2"
sha2 = "0.10"
hex = "0.4"
regex = "1"
log = "0.4"
env_logger = "0.11"
modio = "0.14.2"
tar = "0.4"
xz2 = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
lib_game_detector = { version = "0.0.35", features = ["bundled_sqlite"] }
keyring = { version = "3", default-features = false, features = ["linux-native", "sync-secret-service", "vendored"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

# Pull tao ≥ 0.36 (Wayland decoration/size fixes) before the next crates.io Tauri release.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", rev = "2f1cd75b0f3fb72e6870d719bbfeadedcf8ca884" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", rev = "2f1cd75b0f3fb72e6870d719bbfeadedcf8ca884" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", rev = "2f1cd75b0f3fb72e6870d719bbfeadedcf8ca884" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", rev = "2f1cd75b0f3fb72e6870d719bbfeadedcf8ca884" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", rev = "2f1cd75b0f3fb72e6870d719bbfeadedcf8ca884" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", rev = "2f1cd75b0f3fb72e6870d719bbfeadedcf8ca884" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", rev = "2f1cd75b0f3fb72e6870d719bbfeadedcf8ca884" }
